name: dynamic-api-with-static-onnxruntime
  
on:
  push:
    branches:
      - feature/dynamic-api-with-static-onnxruntime


jobs:
  windows-build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Enable CL
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Build
      run: |
        mkdir build
        cmake -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_INSTALL_PREFIX=install-dir -DBUILD_SHARED_LIBS=ON -DSHERPA_STATIC_ONNXRUNTIME=OFF -DSHERPA_STATIC_ONNXRUNTIME=ON -G "Ninja" ..
        cmake --build . -j
        cmake --install .
